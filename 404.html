<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Página no encontrada | Próximo Feriado</title>
    <meta name="description" content="La página que buscás no existe. Volvé al inicio para ver cuántos días faltan para el próximo feriado en Argentina.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0A1428" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
</head>
<body>
    <a class="skip-link" href="#main">Ir al contenido</a>

    <div class="shell">
        <header class="site-header">
            <a class="brand" href="/">
                <img class="brand-logo" src="/images/favicon.png" alt="" width="44" height="44">
                <p class="brand-name">Próximo Feriado</p>
            </a>
        </header>

        <main id="main" class="main">
            <section class="hero" data-mode="today" aria-labelledby="error-titulo">
                <svg class="hero-sun" viewBox="-100 -100 200 200" aria-hidden="true" focusable="false"><circle class="sun-fill" r="26"/></svg>
                <p class="hero-label">Error 404</p>
                <h1 class="hero-name hero-name--xl" id="error-titulo">No encontramos esa página</h1>
                <p class="hero-work">La dirección no existe o fue movida. Volvé al inicio para ver cuántos días faltan para el próximo feriado.</p>
                <div class="actions">
                    <a class="btn btn--light" href="/">Volver al inicio</a>
                    <a class="btn btn--ghost" href="/?v=calendario">Ver el calendario</a>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p class="credit">Proyecto realizado por <a href="https://efectod.com.ar/" target="_blank" rel="noopener">Efecto - Agencia Digital</a></p>
        </footer>
    </div>
</body>
</html>
